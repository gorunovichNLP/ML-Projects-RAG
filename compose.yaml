name: rag-local

services:
  minio:
    # A fixed release makes the local environment reproducible. This is a
    # single-node development server, not a production MinIO deployment.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rag_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rag_local_password}
    ports:
      - "9000:9000" # S3-compatible API used by our Python code.
      - "9001:9001" # Web console for inspecting buckets and objects.
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    # Локальное хранилище dense-векторов. Порты доступны только с этой машины.
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6333:6333" # REST API и Web UI.
      - "127.0.0.1:6334:6334" # gRPC API для будущей индексации.
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  # A named volume keeps uploaded documents after container restarts.
  minio_data:
  # Named volume avoids filesystem compatibility problems with Windows mounts.
  qdrant_data:
